name: eventide_example
description: "Demonstrates how to use the eventide plugin."
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  eventide:
    path: ../
  cupertino_icons: ^2.0.0
  flutter_bloc: ^9.1.0
  equatable: ^3.0.0
  value_state: ^2.0.1
  timezone: ^0.11.2
  provider: ^6.1.2
  calendar_view: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true